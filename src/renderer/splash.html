<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; font-src 'self'; img-src 'self'"
    />
    <title>jSpoofer</title>
    <style>
      @font-face {
        font-family: 'Plus Jakarta Sans';
        font-style: normal;
        font-weight: 200 800;
        font-display: block;
        src: url('../../assets/fonts/plus-jakarta-sans-latin.woff2') format('woff2');
      }
      :root {
        --bg: #ffffff;
        --line: #e4e4e7;
        --text: #09090b;
        --faint: #71717a;
        --brand: #7c3aed;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0c0c0f;
          --line: #27272a;
          --text: #fafafa;
          --faint: #71717a;
        }
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      .card {
        display: flex;
        height: 100%;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--text);
        font-family:
          'Plus Jakarta Sans', 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
        -webkit-app-region: drag;
      }
      img {
        width: 52px;
        height: 52px;
      }
      h1 {
        margin: 0;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: -0.015em;
      }
      .track {
        position: relative;
        width: 96px;
        height: 2px;
        overflow: hidden;
        background: color-mix(in srgb, var(--faint) 30%, transparent);
      }
      .track::after {
        display: block;
        width: 40%;
        height: 100%;
        background: var(--brand);
        content: '';
        animation: slide 1s ease-in-out infinite;
      }
      @keyframes slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="../../assets/logo.png" alt="" />
      <h1>jSpoofer</h1>
      <div class="track"></div>
    </div>
  </body>
</html>
